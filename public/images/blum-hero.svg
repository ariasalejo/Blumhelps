  <!-- torso -->
  <path d="M15 96 Q37 79 65 98 Q88 120 84 174 L70 235 L16 235 Q1 193 3 151Z" fill="url(#person)"/>
  <!-- jacket panels -->
  <path d="M40 96 L53 119 L43 184 L56 233 L35 233 L21 180 L25 126Z" fill="#31534e"/>
  <path d="M62 101 Q82 127 77 165 L67 192 L56 180 L62 144 L54 118Z" fill="#51675e"/>
  <!-- backpack -->
  <path d="M2 112 Q-17 101 -25 124 L-35 177 Q-38 203 -16 216 L7 220 L18 154Z" fill="#a46e45" stroke="#d7b080" stroke-width="3"/>
  <path d="M-19 124 Q-25 151 -23 188 L-5 202 L5 143Z" fill="#724c36"/>
  <path d="M-27 166 L6 170 M-21 192 L1 196" stroke="#d6b17d" stroke-width="3" opacity=".8"/>
  <!-- arm reaching down -->
  <path d="M71 126 Q92 154 95 184 L84 206 Q73 211 67 198 L70 174 L57 148Z" fill="#172a2b"/>
  <!-- neck and head -->
  <path d="M28 89 L27 109 L47 116 L53 93Z" fill="#9a704f"/>
  <path d="M20 56 Q23 30 46 35 Q66 39 62 64 L55 89 Q44 103 30 88Z" fill="#9b7352"/>
  <path d="M18 59 Q9 41 25 26 Q39 15 56 29 Q70 32 68 53 L59 48 Q52 39 41 43 Q31 48 18 59Z" fill="#12272a"/>
  <!-- light seam -->
  <path d="M35 117 L43 134" stroke="#d6b17d" stroke-width="3" opacity=".8"/>
</g>
<!-- soft cinematic overlay to give title contrast -->
<rect width="1800" height="1050" fill="url(#shadow)"/>
<rect width="1800" height="1050" fill="url(#grain)" opacity=".48"/>
</svg>