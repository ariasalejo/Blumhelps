<path d="M0 685 Q140 622 273 711 Q396 785 520 722 Q630 666 735 730 Q818 776 875 735 Q938 696 1018 748 Q1098 803 1198 756 Q1321 699 1417 775 Q1547 864 1674 767 L1800 704 L1800 1050 L0 1050Z" fill="#315e4a"/>
