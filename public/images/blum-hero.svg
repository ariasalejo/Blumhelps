<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
<title id="title">Amanecer sobre las montañas de Colombia</title>
<desc id="desc">Ilustración panorámica de montañas, un río que refleja el amanecer y una persona contemplando el paisaje.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.15" y2="1">
    <stop offset="0" stop-color="#173b48"/><stop offset=".34" stop-color="#6e8590"/><stop offset=".64" stop-color="#e4ad83"/><stop offset="1" stop-color="#f4d6a9"/>
  </linearGradient>
  <radialGradient id="glow" cx=".69" cy=".38" r=".45"><stop offset="0" stop-color="#fff6d1" stop-opacity=".95"/><stop offset=".18" stop-color="#ffdc9d" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf8c" stop-opacity="0"/></radialGradient>
  <linearGradient id="farMountain" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#879ca0"/><stop offset="1" stop-color="#536e73"/></linearGradient>
  <linearGradient id="middleMountain" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#667e7b"/><stop offset="1" stop-color="#284f4e"/></linearGradient>
  <linearGradient id="nearMountain" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4c7665"/><stop offset="1" stop-color="#102f2d"/></linearGradient>
  <linearGradient id="river" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#edc08e"/><stop offset=".42" stop-color="#95aaa0"/><stop offset="1" stop-color="#345f5c"/></linearGradient>
  <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#062d30" stop-opacity=".97"/><stop offset=".48" stop-color="#062d30" stop-opacity=".65"/><stop offset=".74" stop-color="#062d30" stop-opacity=".04"/><stop offset="1" stop-color="#062d30" stop-opacity=".08"/></linearGradient>
  <linearGradient id="person" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e3437"/><stop offset="1" stop-color="#071b21"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
  <pattern id="grain" width="180" height="180" patternUnits="userSpaceOnUse"><circle cx="11" cy="20" r="1" fill="#fff" opacity=".13"/><circle cx="98" cy="73" r=".8" fill="#fff" opacity=".14"/><circle cx="143" cy="148" r="1" fill="#fff" opacity=".11"/><circle cx="47" cy="122" r=".7" fill="#fff" opacity=".12"/></pattern>
</defs>
<rect width="1800" height="1050" fill="url(#sky)"/>
<rect width="1800" height="1050" fill="url(#glow)"/>
<ellipse cx="1240" cy="400" rx="380" ry="180" fill="#ffdca5" opacity=".3" filter="url(#blur)"/>
<circle cx="1248" cy="350" r="62" fill="#fff4cf" opacity=".9"/>
<circle cx="1248" cy="350" r="110" fill="#fff1c5" opacity=".22" filter="url(#soft)"/>
