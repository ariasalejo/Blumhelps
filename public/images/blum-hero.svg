<g fill="#092b29" opacity=".92">
<path d="M0 1050 L0 776 Q31 827 20 887 Q57 837 81 818 Q75 871 43 906 Q94 869 129 869 Q111 911 58 932 Q103 929 148 956 L152 1050Z"/>
<path d="M1800 1050 L1800 744 Q1765 794 1774 847 Q1738 801 1712 787 Q1717 837 1750 870 Q1698 842 1664 847 Q1684 886 1734 901 Q1682 911 1653 945 L1650 1050Z"/>
