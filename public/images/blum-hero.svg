</g>
<!-- a lone traveler on a ridge: symbolism, not a real person -->
<g transform="translate(1015 548)">
  <ellipse cx="38" cy="319" rx="114" ry="19" fill="#062725" opacity=".42" filter="url(#soft)"/>
  <!-- legs and boots -->
  <path d="M14 224 L2 280 Q-5 300 14 307 L54 307 Q67 298 45 286 L43 252 L71 302 Q79 316 99 308 L112 302 L87 276 L64 221Z" fill="#101e23"/>
  <path d="M8 299 Q-9 301 -20 315 Q-21 324 0 324 L43 324 Q57 320 47 309 L30 301Z" fill="#071a20"/>
