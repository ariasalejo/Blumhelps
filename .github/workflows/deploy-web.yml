name: BlumHelps Web — Validate and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blumhelps-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, type-check and build the PWA
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Validate product structure, routes, accessibility and lockfile
        run: npm run validate
        working-directory: web
      - name: Build production PWA for GitHub Pages
        run: npm run build
        working-directory: web
        env:
          GITHUB_PAGES: 'true'
      - name: Configure SPA fallback for direct links and refresh
        run: cp dist/index.html dist/404.html
        working-directory: web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Build production PWA for GitHub Pages
        run: npm run build
        working-directory: web
        env:
          GITHUB_PAGES: 'true'
      - name: Configure SPA fallback for direct links and refresh
        run: cp dist/index.html dist/404.html
        working-directory: web
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload compiled site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
