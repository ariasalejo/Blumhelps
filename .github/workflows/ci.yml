name: Android CI
on:
  push:
    branches: [main, feat/futuristic-wellbeing-habits]
  pull_request:
    branches: [main, feat/actionable-resource-directory]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog-validation:
    name: Validate public resource catalog metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate catalog invariants
        run: node scripts/validate-catalog.mjs

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: BlumHelps-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
