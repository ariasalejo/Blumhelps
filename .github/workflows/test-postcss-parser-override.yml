name: Test patched PostCSS parser override

on:
  push:
    branches: [feat/futuristic-wellbeing-habits]
    paths:
      - '.github/workflows/test-postcss-parser-override.yml'

permissions:
  contents: write

concurrency:
  group: blumhelps-test-postcss-parser-override
  cancel-in-progress: false

jobs:
  test-override:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Regenerate lock from the exact override
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: web
      - name: Verify clean reproducible install
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Block moderate or higher runtime findings
        run: npm audit --omit=dev --audit-level=moderate
        working-directory: web
      - name: Validate application and lockfile
        run: npm run validate
        working-directory: web
      - name: Type-check and build the production PWA
        run: npm run build
        working-directory: web
      - name: Test Tailwind and nested CSS output
        shell: bash
        working-directory: web
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync, readdirSync } from "node:fs";
            const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
            assert.equal(lock.packages["node_modules/postcss-selector-parser"].version, "7.1.6");
            const assets = readdirSync("dist/assets").filter((name) => name.endsWith(".css"));
            assert.ok(assets.length > 0, "Expected generated CSS bundle.");
            const css = assets.map((name) => readFileSync("dist/assets/" + name, "utf8")).join("\n");
            assert.match(css, /\.bg-gradient-to-br|\.bg-gradient-to-b|\.bg-forest/, "Tailwind utility output must still be generated.");
            assert.match(css, /prefers-reduced-motion/, "Reduced-motion rules must remain in the output.");
            console.log("PASS: patched selector parser and Tailwind CSS output");
          '
      - name: Report remaining development-tree advisories
        shell: bash
        working-directory: web
        run: |
          npm audit --json > /tmp/blumhelps-audit.json || true
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("/tmp/blumhelps-audit.json", "utf8"));
            console.log("Full tree vulnerability counts: " + JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              if (!["moderate", "high", "critical"].includes(item.severity)) continue;
              console.log(item.severity.toUpperCase() + " " + name + " — " + (item.via ?? []).filter(v => typeof v === "object").map(v => v.url ?? v.title).join(", "));
            }
          '
      - name: Commit proven lockfile and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git rm .github/workflows/test-postcss-parser-override.yml
          git commit -m "fix(deps): apply patched PostCSS selector parser"
          git push origin "HEAD:$GITHUB_REF_NAME"
