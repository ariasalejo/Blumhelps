name: Web PWA and API CI

on:
  push:
    branches: [feat/futuristic-wellbeing-habits]
  pull_request:
    branches: [main, feat/futuristic-wellbeing-habits]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa:
    name: PWA lockfile, validation and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Block high or critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report high-severity development-tool advisories
        shell: bash
        run: |
          npm audit --json > /tmp/blumhelps-npm-audit.json || true
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const audit = JSON.parse(readFileSync("/tmp/blumhelps-npm-audit.json", "utf8"));
            const issues = Object.entries(audit.vulnerabilities ?? {}).filter(([, item]) => ["high", "critical"].includes(item.severity));
            if (issues.length === 0) {
              console.log("PASS: no high or critical advisories in the complete dependency tree.");
            } else {
              console.warn("NOTICE: high/critical advisories remain in the full tree; the production-only audit is a blocking gate.");
              for (const [name, item] of issues) {
                const urls = (item.via ?? []).filter(v => typeof v === "object").map(v => v.url).filter(Boolean);
                console.warn(`${item.severity.toUpperCase()} ${name} (${item.isDirect ? "direct" : "transitive"}; fix available: ${JSON.stringify(item.fixAvailable)}): ${urls.join(", ")}`);
              }
            }
          '
      - run: npm run validate
      - run: npm run build

  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
